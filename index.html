.quiz-question.fade-out {
  animation: fadeOutUp 0.3s ease forwards;
}
.quiz-options.fade-out {
  animation: fadeOutUp 0.3s ease forwards;
}
.quiz-question.fade-in {
  animation: fadeInDown 0.4s ease;
}
.quiz-options.fade-in {
  animation: fadeInDown 0.4s ease 0.1s backwards;
}
@keyframes fadeOutUp {
  to { opacity: 0; transform: translateY(-20px); }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }

// ===== 状态 =====
let currentQuestion = 0;
let scores = {};

// ===== 视图切换 =====
function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById(viewId);
  view.classList.add('active');
  window.scrollTo(0, 0);
}

// ===== 开始测试 =====
function startQuiz() {
  currentQuestion = 0;
  scores = {};
  showView('view-quiz');
  renderQuestion();
}

// ===== 渲染题目 =====
function renderQuestion() {
  const q = questions[currentQuestion];
  const total = questions.length;

  // 更新进度
  document.getElementById('progress-text').textContent = (currentQuestion + 1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = ((currentQuestion + 1) / total * 100) + '%';

  // 题目
  const questionEl = document.getElementById('question-text');
  const optionsEl = document.getElementById('options-container');

  questionEl.classList.remove('fade-in');
  optionsEl.classList.remove('fade-in');
  void questionEl.offsetWidth; // 触发重排
  questionEl.classList.add('fade-in');
  optionsEl.classList.add('fade-in');

  questionEl.textContent = q.q;

  // 选项
  optionsEl.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'quiz-option';
    div.innerHTML = '<span class="quiz-option-letter">' + letters[i] + '</span>' + opt.text;
    div.onclick = () => selectOption(i);
    optionsEl.appendChild(div);
  });
}

// ===== 选择选项 =====
function selectOption(index) {
  const q = questions[currentQuestion];
  const selected = q.options[index];

  // 计分
  for (const [persona, score] of Object.entries(selected.scores)) {
    scores[persona] = (scores[persona] || 0) + score;
  }

  // 选中动画
  const options = document.querySelectorAll('.quiz-option');
  options.forEach((opt, i) => {
    if (i === index) opt.classList.add('selected');
    opt.style.pointerEvents = 'none';
  });

  // 延迟进入下一题
  setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 400);
}

// ===== 计算结果 =====
function calculateResult() {
  let maxScore = -1;
  let result = 'calm';
  for (const [persona, score] of Object.entries(scores)) {
    if (score > maxScore) {
      maxScore = score;
      result = persona;
    }
  }
  return result;
}

// ===== 展示结果 =====
function showResult() {
  const resultKey = calculateResult();
  const persona = personas[resultKey];
  const resultView = document.getElementById('view-result');

  // 设置人格配色class
  resultView.setAttribute('data-persona', resultKey);
  resultView.className = 'view result-view active ' + persona.class;

  // 填充内容
  document.getElementById('result-name').textContent = persona.name;
  document.getElementById('result-name-en').textContent = persona.nameEn;
  document.getElementById('result-desc').textContent = persona.desc;
  document.getElementById('result-strength').textContent = persona.strength;
  document.getElementById('result-challenge').textContent = persona.challenge;
  document.getElementById('result-advice').textContent = persona.advice;

  // 徽章图标
  document.querySelector('#result-badge svg').innerHTML = persona.icon;

  // 标签
  const tagsEl = document.getElementById('result-tags');
  tagsEl.innerHTML = '';
  persona.tags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'result-tag';
    span.textContent = tag;
    tagsEl.appendChild(span);
  });

  showView('view-result');
}

      '<div class="gallery-card-name-en">' + p.nameEn + '</div>' +
      '<div class="gallery-card-desc">' + p.desc + '</div>' +
      '<div class="gallery-card-tags">' + p.tags.map(t => '<span>' + t + '</span>').join('') + '</div>';
    grid.appendChild(card);
  });
}

// ===== 分享 =====
function shareResult() {
  const resultKey = document.getElementById('view-result').getAttribute('data-persona');
  const persona = personas[resultKey];
  const text = '我是「' + persona.name + '」！' + persona.tags.join(' ') + ' 你的职场人格是什么？';

  if (navigator.share) {
    navigator.share({
      title: '我的职场人格测试结果',
      text: text,
      url: window.location.href
    }).catch(() => {});
  } else {
    // 复制到剪贴板
    navigator.clipboard.writeText(text + ' ' + window.location.href).then(() => {
      alert('结果已复制，快去分享到小红书/朋友圈吧！');
    }).catch(() => {
      alert(text);
    });
  }
}

// ===== 初始化 =====
showView('view-landing');
</script>
